# example_job_posts — a handful of real posts per field, as illustrations.
#
# These exist to show what employers actually ask for. They are a small,
# hand-curated, deliberately stale set: NOT a job index, and they never power
# job search (PRD hard constraint). Seeded by `pnpm seed` into the Supabase
# `example_job_posts` table (upsert by id, delete anything not listed here)
# after validation by `ExampleJobPostSchema` in src/lib/reference-schema.ts.
#
# Phase 1.3 fills this file. Until then it is an empty list.
#
# Shape: a top-level YAML list. One entry per post.
#
#   - id: fluence-dispatch-engineer-2026-03
#     field_id: grid-scale-storage    # must match an id in climate_fields.yaml
#     role_id: storage-dispatch-optimization-engineer   # optional; must match
#                                     #   an id in example_roles.yaml if given
#     title: Senior Software Engineer, Dispatch
#     company: Fluence
#     requirements_summary: >-        # the curator's summary, NOT a copy of
#                                     #   the post text
#       Five years of backend Python, experience with optimization or market
#       bidding, no energy background required.
#     source_url: https://fluenceenergy.com/careers/12345
#     posted_date: 2026-03-04         # optional, YYYY-MM-DD
#     retrieved_at: 2026-03-11        # required, YYYY-MM-DD: posts go stale
#
# Rules the validator and the database both enforce:
#
#   * BLOCKED DOMAINS. `source_url` may never point at linkedin.com,
#     indeed.com or climatebase.org, or any subdomain (PRD hard constraint:
#     no scraping those sites). Look-alikes like notlinkedin.com are fine.
#     Use company career pages and boards that permit access. Enforced by the
#     seed validator AND by a CHECK constraint in the migration.
#   * NO PERSONAL PROFILES. Posts describe roles at companies, never people.
#   * `field_id` (and `role_id` when present) must exist; the seed refuses to
#     run otherwise, and both columns are foreign keys.

